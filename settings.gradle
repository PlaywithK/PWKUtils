pluginManagement {
	repositories {
		gradlePluginPortal()
	}
}
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id("dev.kikugie.stonecutter") version "0.9.8"
}

stonecutter {
	centralScript = "build.gradle"
	create(rootProject) {
		versions("1.21.1", "1.21.9", "1.21.11", "26.1.2", "26.2")
		vcsVersion = "1.21.1"
	}
}