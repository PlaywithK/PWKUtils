plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.148'
}

def isUnobfuscated = stonecutter.eval(stonecutter.current.version, ">=26.1")
def isLegacyModsToml = stonecutter.eval(stonecutter.current.version, "<1.20.5")

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

def javaVersion = isUnobfuscated ? 25 : (isLegacyModsToml ? 17 : 21)
java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

def dependencyRequirement = isLegacyModsToml ? 'mandatory = true' : 'type = "required"'

neoForge {
	version = project.neo_version

	if (!isUnobfuscated) {
		parchment {
			minecraftVersion = project.parchment_minecraft_version
			mappingsVersion = project.parchment_mappings_version
		}
	}

	runs {
		server {
			server()
			programArguments.add('--nogui')
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			neo_version            : neo_version,
			neo_version_range      : neo_version_range,
			loader_version_range   : loader_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description,
			dependency_requirement : dependencyRequirement
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from rootProject.file("src/main/templates")
	into "build/generated/sources/modMetadata"
	if (isLegacyModsToml) {
		rename 'neoforge\\.mods\\.toml', 'mods.toml'
	}
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}