modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "pwkutils"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"

# Mixin-Configs werden hier registriert (nicht mehr in der Mod-Metadatei wie bei Fabric)
[[mixins]]
config = "pwkutils.mixins.json"

[[dependencies.pwkutils]]
modId = "neoforge"
${dependency_requirement}
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "SERVER"

[[dependencies.pwkutils]]
modId = "minecraft"
${dependency_requirement}
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "SERVER"